<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Billly</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top left, #2a1f2f 0%, #101119 55%, #0b0c11 100%);
        color: #f3f4f6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: rgba(25, 28, 43, 0.95);
        border-radius: 16px;
        padding: 24px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        text-align: center;
        width: min(360px, 90vw);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 6px 0;
        color: #9aa3b2;
      }
      a {
        color: #d946ef;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Billly</h1>
      <p>Copyright © 2026 Oliver Jessner</p>
      <p><a href="https://oliverjessner.at" target="_blank" rel="noreferrer">oliverjessner.at</a></p>
    </div>
  </body>
</html>
